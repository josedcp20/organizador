name = "organizador-api"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["*/10 * * * *"]

[vars]
TZ = "Europe/Madrid"
ALLOWED_ORIGIN = "https://josedcp20.github.io"
APP_URL = "https://josedcp20.github.io/organizador/"
# `sub` del JWT VAPID (Web Push, U2): URL https de la app, no es secreto.
VAPID_SUBJECT = "https://josedcp20.github.io/organizador/"
# Debe coincidir EXACTAMENTE con la URI autorizada en Google Cloud (M7). En local se sobrescribe en .dev.vars.
GOOGLE_REDIRECT_URI = "https://organizador-api.jose-dcp20.workers.dev/oauth/google/callback"

[[d1_databases]]
binding = "DB"
database_name = "organizador"
# ID devuelto por `wrangler d1 create organizador` (no es secreto).
database_id = "78ad4ca2-5104-4380-b72f-16c0a812a82d"
migrations_dir = "migrations"
