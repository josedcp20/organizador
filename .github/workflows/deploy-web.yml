name: Deploy web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_API_BASE: ${{ vars.VITE_API_BASE }}
    steps:
      - name: Validar VITE_API_BASE
        run: |
          if [[ -z "$VITE_API_BASE" ]]; then
            echo "::error::La variable de repo VITE_API_BASE esta vacia. Definela en Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi
          if [[ "$VITE_API_BASE" != https://* ]]; then
            echo "::error::VITE_API_BASE debe empezar por https://"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
